- vars:
    USER_STORY: "As a new user, I want to sign up using my email or an existing Google/Apple account, so that my saved spots and trips are securely stored and synced across my devices."
  description: "new user sign up"
  assert:
    - type: javascript
      description: Persona correct
      value: JSON.parse(output).Persona === "new user"
    - type: javascript
      description: GoalAction is exactly sign up
      value: |
        const p = JSON.parse(output);
        return p.GoalAction.some(a => a === "sign up");
    - type: javascript
      description: GoalEntity includes array of [email, Google account, Apple account, Google/Apple account] 
      value: |
        const p = JSON.parse(output);
        const expected = [
          "email",
          "Google account",
          "Apple account",
          "Google/Apple account",
        ];
        return Array.isArray(p.GoalEntity)
            && p.GoalEntity.some(entity => expected.includes(entity));
    - type: javascript
      description: BenefitAction includes array of [stored, synced]
      value: |
        const p = JSON.parse(output);
        const expected = ["stored", "synced"];
        return Array.isArray(p.BenefitAction)
            && p.BenefitAction.length === expected.length
            && expected.every(action => p.BenefitAction.some(a => a === action));
    - type: javascript
      description: BenefitEntity includes array of [spots, trips]
      value: |
        const p = JSON.parse(output);
        const expected = ["spots", "trips"];
        return Array.isArray(p.BenefitEntity)
            && p.BenefitEntity.some(entity => expected.includes(entity));
    - type: javascript
      description: triggers correct
      value: |
        const p = JSON.parse(output);
        return p.triggers.some(t => t[0] === "new user" && t[1] === "sign up");
    - type: javascript
      description: targets has array of [[sign up → Google account], [sign up → email], [sign up → Apple account], [sign up → Google/Apple account], [stored → spots], [stored → trips], [synced → trips], [synced → spots]]
      value: |
        const p = JSON.parse(output);
        const expected = [
          ["sign up", "Google account"],
          ["sign up", "email"],
          ["sign up", "Apple account"],
          ["sign up", "Google/Apple account"],
          ["stored", "spots"],
          ["stored", "trips"],
          ["synced", "trips"],
          ["synced", "spots"],
        ];
        return Array.isArray(p.targets)
            && p.targets.length === expected.length
            && expected.every(pair => p.targets.some(t => t[0] === pair[0] && t[1] === pair[1]));
    - type: javascript
      description: contains contains array [[spots, devices], [trips, devices]] or is empty if no prepositional context
      value: |
        const p = JSON.parse(output);
        const expected = [
          ["spots", "devices"],
          ["trips", "devices"]
        ];
        return Array.isArray(p.contains)
            && (p.contains.length === 0 || expected.every(pair => p.contains.some(c => c[0] === pair[0] && c[1] === pair[1])));

- vars:
    USER_STORY: "As a returning user, I want to log in my account on a new device and log out when I'm finished, so that I can access my travel data safely and maintain privacy on shared devices."
  description: "returning user login logout"
  assert:
    - type: javascript
      description: Persona correct
      value: JSON.parse(output).Persona === "returning user"
    - type: javascript
      description: GoalAction includes array [log in, log out]
      value: |
        const p = JSON.parse(output);
        const expected = ["log in", "log out"];
        return Array.isArray(p.GoalAction)
            && p.GoalAction.length === expected.length
            && expected.every(action => p.GoalAction.some(a => a === action));
    - type: javascript
      description: GoalEntity includes account only
      value: |
        const p = JSON.parse(output);
        return p.GoalEntity.some(e => e === "account");
    - type: javascript
      description: BenefitAction includes array [access, maintain]
      value: |
        const p = JSON.parse(output);
        const expected = ["access", "maintain"];
        return Array.isArray(p.BenefitAction)
            && p.BenefitAction.length === expected.length
            && expected.every(action => p.BenefitAction.some(a => a === action));
    - type: javascript
      description: BenefitEntity includes array of [travel data, privacy]
      value: |
        const p = JSON.parse(output);
        const expected = ["travel data", "privacy"];
        return Array.isArray(p.BenefitEntity)
            && expected.every(entity => p.BenefitEntity.some(e => e === entity));
    - type: javascript
      description: triggers has correct pairs for both actions
      value: |
        const p = JSON.parse(output);
        return p.triggers.some(t => t[0] === "returning user" && t[1] === "log in")
            && p.triggers.some(t => t[0] === "returning user" && t[1] === "log out");
    - type: javascript
      description: targets has [[log in → account], [log out → account], [access → travel data], [maintain → privacy]]
      value: |
        const p = JSON.parse(output);
        const expected = [
          ["log in", "account"],
          ["log out", "account"],
          ["access", "travel data"],
          ["maintain", "privacy"],
        ];
        return Array.isArray(p.targets)
            && p.targets.length === expected.length
            && expected.every(pair => p.targets.some(t => t[0] === pair[0] && t[1] === pair[1]));
    - type: javascript
      description: contains includes account on new device and privacy on shared devices
      value: |
        const p = JSON.parse(output);
        const expected = [
          ["account", "new device"],
          ["privacy", "shared devices"]
        ];
        return Array.isArray(p.contains)
            && p.contains.length === expected.length
            && expected.every(pair => p.contains.some(c => c[0] === pair[0] && c[1] === pair[1]));

