- vars:
    USER_STORY: "As a user, I want to enable two-factor authentication so that my account is more secure."
  description: user 2FA
  assert:
    - type: javascript
      description: Persona is correct
      value: JSON.parse(output).Persona === "user"

    - type: javascript
      description: GoalAction correct
      value: |
        const p = JSON.parse(output);
        return p.GoalAction.includes("enable");

    - type: javascript
      description: GoalEntity correct
      value: |
        const p = JSON.parse(output);
        return p.GoalEntity.some(e => e.includes("authentication") || e.includes("two-factor authentication"));

    - type: javascript
      description: BenefitAction correct
      value: |
        const p = JSON.parse(output);
        return p.BenefitAction.length === 0;
        
    - type: javascript
      description: BenefitEntity correct
      value: |
        const p = JSON.parse(output);
        return p.BenefitEntity.includes("account") || p.BenefitEntity.includes("my account");

    - type: javascript
      description: triggers correct
      value: |
        const p = JSON.parse(output);
        return p.triggers.some(t => t[0] === "user" && t[1] === "enable");

    - type: javascript
      description: targets includes account
      value: |
        const p = JSON.parse(output);
        return p.targets.some(t => t[0] === "enable" && t[1].includes("authentication")) || p.targets.some(t => t[0] === "enable" && t[1].includes("two-factor authentication"));