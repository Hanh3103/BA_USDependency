# eval_promptfoo/tests/user_stories.yaml

- vars:
    USER_STORY: "As a shopper, I want to save items to a wishlist so that I can purchase them later."
  description: shopper wishlist
  assert:
    - type: javascript
      description: Persona is correct
      value: JSON.parse(output).Persona === "shopper"

    - type: javascript
      description: GoalAction correct
      value: |
        const p = JSON.parse(output);
        return p.GoalAction.includes("save");

    - type: javascript
      description: GoalEntity correct
      value: |
        const p = JSON.parse(output);
        return p.GoalEntity.includes("items");

    - type: javascript
      description: BenefitAction correct
      value: |
        const p = JSON.parse(output);
        return p.BenefitAction.includes("purchase");

    - type: javascript
      description: BenefitEntity correct
      value: |
        const p = JSON.parse(output);
        return p.BenefitEntity.some(e => e.includes("item"));

    - type: javascript
      description: triggers correct
      value: |
        const p = JSON.parse(output);
        return p.triggers.some(t => t[0] === "shopper" && t[1] === "save");

    - type: javascript
      description: targets correct
      value: |
        const p = JSON.parse(output);
        return p.targets.some(t => t[0] === "save" && t[1].includes("items")) && p.targets.some(t => t[0] === "purchase" && t[1].includes("items"));
    
    - type: javascript
      description: contains correct
      value: |
        const p = JSON.parse(output);
        return p.contains.some(c => c[0] === "items" && c[1] === "a whishlist"));

- vars:
    USER_STORY: "As an admin, I want to export monthly sales reports to CSV so that I can analyze revenue."
  description: admin export
  assert:
    - type: javascript
      description: Persona is correct
      value: JSON.parse(output).Persona === "admin"

    - type: javascript
      description: GoalAction correct
      value: |
        const p = JSON.parse(output);
        return p.GoalAction.includes("export");

    - type: javascript
      description: GoalEntity correct
      value: |
        const p = JSON.parse(output);
        return p.GoalEntity.some(e => e.includes("report") || e.includes("sales")) || e.includes("sales report") || e.includes("monthly sales report");

    - type: javascript
      description: BenefitAction correct
      value: |
        const p = JSON.parse(output);
        return p.BenefitAction.includes("analyze");

    - type: javascript
      description: BenefitEntity correct
      value: |
        const p = JSON.parse(output);
        return p.BenefitEntity.includes("revenue");

    - type: javascript
      description: triggers correct
      value: |
        const p = JSON.parse(output);
        return p.triggers.some(t => t[0] === "admin" && t[1] === "export");

    - type: javascript
      description: targets correct
      value: |
        const p = JSON.parse(output);
        return (p.targets.some(t => t[0] === "export" && t[1].includes("report")) || p.targets.some(t => t[0] === "export" && t[1].includes("sales report")) || p.targets.some(t => t[0] === "export" && t[1].includes("monthly sales report"))) && p.targets.some(t => t[0] === "analyze" && t[1].includes("revenue"));

    - type: javascript
      description: No contains when no prepositional context
      value: |
        const p = JSON.parse(output);
        return p.contains.length === 0;

