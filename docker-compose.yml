services:
  app:
    build: ./app
    ports:
      - "8000:8000"
    depends_on:
    - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ./app/tools/results:/app/tools/results
      - ./app/test_raw_input:/app/test_raw_input

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:

